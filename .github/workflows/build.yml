name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            exe_ext: .exe
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            exe_ext: ""
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: macos-14
            goos: darwin
            goarch: arm64
            exe_ext: ""
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          # 软路由版本 - 旧款/嵌入式 OpenWrt 设备
          - os: ubuntu-latest
            goos: linux
            goarch: armv7
            goarch_target: arm
            goarm: "7"
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: armv6
            goarch_target: arm
            goarm: "6"
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: mips
            gomips: "softfloat"
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: mipsle
            gomips: "softfloat"
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Initialize Go module
        run: |
          go mod init ech-workers || true
          go mod tidy

      - name: Build Go executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch_target || matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          echo "Building for $GOOS/$GOARCH (target=${{ matrix.target }}, CGO_ENABLED=$CGO_ENABLED)"
          go build -trimpath -ldflags="-s -w" -o ech-workers${{ matrix.exe_ext }} ech-workers.go
        shell: bash

      # 下面这些步骤：只有打 tag 且 enable_gui == true 时才会执行，用来打包 GUI

      - name: Set up Python
        if: startsWith(github.ref, 'refs/tags/') && matrix.enable_gui == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'linux' && matrix.enable_gui == true
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtsvg python3-dev
        shell: bash

      - name: Install PyInstaller, PySocks, and other dependencies
        if: startsWith(github.ref, 'refs/tags/') && matrix.enable_gui == true
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.goos }}" == "linux" ]; then
            # Linux: 使用系统包中的 PyQt5，只安装其他依赖
            pip install pyinstaller pystray Pillow PySocks
            python -c "import PyQt5.QtWidgets; print('PyQt5 available')" || echo "PyQt5 not available, will skip GUI build"
          else
            # Windows / macOS: 从 PyPI 安装
            pip install pyinstaller PyQt5 pystray Pillow PySocks
          fi
        shell: bash

      - name: Check application icon
        if: startsWith(github.ref, 'refs/tags/') && matrix.enable_gui == true
        run: |
          # 检查图标文件是否存在（图标文件已包含在仓库中）
          echo "Checking for icon files..."
          ls -lh app_icon.* 2>/dev/null || echo "No icon files found"
          if [ "${{ matrix.goos }}" == "windows" ]; then
            if [ -f "app_icon.ico" ]; then
              echo "✓ Found app_icon.ico"
            elif [ -f "app_icon.png" ]; then
              echo "✓ Found app_icon.png (will be used as icon)"
            else
              echo "⚠ No icon file found, PyInstaller will use default icon"
            fi
          elif [ "${{ matrix.goos }}" == "darwin" ]; then
            if [ -f "app_icon.icns" ]; then
              echo "✓ Found app_icon.icns"
            elif [ -f "app_icon.png" ]; then
              echo "✓ Found app_icon.png (will be used as icon)"
            else
              echo "⚠ No icon file found, PyInstaller will use default icon"
            fi
          else
            if [ -f "app_icon.png" ]; then
              echo "✓ Found app_icon.png"
            else
              echo "⚠ No icon file found, PyInstaller will use default icon"
            fi
          fi
        shell: bash

      - name: Build Python executable
        if: startsWith(github.ref, 'refs/tags/') && matrix.enable_gui == true
        run: |
          # 构建 PyInstaller 命令，根据平台添加图标
          ICON_ARG=""
          if [ "${{ matrix.goos }}" == "windows" ]; then
            if [ -f "app_icon.ico" ]; then
              ICON_ARG="--icon=app_icon.ico"
            elif [ -f "app_icon.png" ]; then
              ICON_ARG="--icon=app_icon.png"
            fi
            pyinstaller --onefile --windowed --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py
          elif [ "${{ matrix.goos }}" == "linux" ]; then
            if python -c "import PyQt5.QtWidgets" 2>/dev/null; then
              if [ -f "app_icon.png" ]; then
                ICON_ARG="--icon=app_icon.png"
              fi
              pyinstaller --onefile --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py
            else
              echo "PyQt5 not available, skipping GUI build for Linux"
              echo "Only Go executable will be included"
            fi
          else
            # macOS
            if [ -f "app_icon.icns" ]; then
              ICON_ARG="--icon=app_icon.icns"
            elif [ -f "app_icon.png" ]; then
              ICON_ARG="--icon=app_icon.png"
            fi
            pyinstaller --onefile --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py
          fi
        shell: bash

      - name: Download China IP list
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Downloading latest China IP list (IPv4 and IPv6)..."
          curl -L -o chn_ip.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/refs/heads/master/chn_ip.txt" || echo "Failed to download IPv4 list, will skip"
          curl -L -o chn_ip_v6.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/refs/heads/master/chn_ip_v6.txt" || echo "Failed to download IPv6 list, will skip"
          if [ -f "chn_ip.txt" ]; then
            echo "✓ China IPv4 IP list downloaded successfully"
            wc -l chn_ip.txt
          else
            echo "⚠ China IPv4 IP list download failed, release will continue without it"
          fi
          if [ -f "chn_ip_v6.txt" ]; then
            echo "✓ China IPv6 IP list downloaded successfully"
            wc -l chn_ip_v6.txt
          else
            echo "⚠ China IPv6 IP list download failed, release will continue without it"
          fi
        shell: bash

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          
          # Go 可执行文件
          cp ech-workers${{ matrix.exe_ext }} release/
          
          # 中国IP列表文件（离线版本）
          if [ -f "chn_ip.txt" ]; then
            cp chn_ip.txt release/
            echo "✓ China IPv4 IP list included in release"
          fi
          if [ -f "chn_ip_v6.txt" ]; then
            cp chn_ip_v6.txt release/
            echo "✓ China IPv6 IP list included in release"
          fi
          
          # GUI（仅桌面版）
          if [ "${{ matrix.enable_gui }}" = "true" ]; then
            if [ "${{ matrix.goos }}" == "windows" ]; then
              if [ -f "dist/ECHWorkersGUI.exe" ]; then
                cp dist/ECHWorkersGUI.exe release/
              fi
            else
              if [ -f "dist/ECHWorkersGUI" ]; then
                cp dist/ECHWorkersGUI release/
                chmod +x release/ECHWorkersGUI
              elif [ "${{ matrix.goos }}" == "linux" ]; then
                echo "GUI executable not built, only Go executable will be included"
              fi
            fi
          fi
          
          # README
          {
            echo "ECH Workers Client"
            echo ""
            echo "Target: ${{ matrix.target }}"
            echo ""
            echo "Files:"
            echo "- ech-workers${{ matrix.exe_ext }}: Go compiled core proxy program"
            if [ -f "release/chn_ip.txt" ]; then
              echo "- chn_ip.txt: China IPv4 IP list (offline version)"
            fi
            if [ -f "release/chn_ip_v6.txt" ]; then
              echo "- chn_ip_v6.txt: China IPv6 IP list (offline version)"
            fi
            if [ "${{ matrix.enable_gui }}" = "true" ]; then
              if [ "${{ matrix.goos }}" == "windows" ]; then
                echo "- ECHWorkersGUI.exe: Python GUI client (standalone executable)"
              elif [ -f "release/ECHWorkersGUI" ]; then
                echo "- ECHWorkersGUI: Python GUI client (standalone executable)"
              else
                echo "- Note: GUI client not available for this architecture"
                echo "  Use ech-workers from command line instead"
              fi
            else
              echo "- GUI client not included for this build (CLI only, suitable for routers / servers)"
            fi
            echo ""
            echo "Usage:"
            if [ "${{ matrix.goos }}" == "windows" ]; then
              echo "1. Double-click ECHWorkersGUI.exe to launch the GUI (if present)"
              echo "2. Or run ech-workers.exe from command line"
            else
              echo "1. Run ./ech-workers from command line"
              if [ "${{ matrix.enable_gui }}" = "true" ]; then
                echo "2. Or run ./ECHWorkersGUI to launch the GUI"
              fi
            fi
            echo ""
            echo "System Requirements:"
            if [ "${{ matrix.target }}" = "softrouter" ]; then
              echo "- Linux soft router / NAS (OpenWrt / iStoreOS / x86_64 or ARM64)"
              echo "- Architecture: ${{ matrix.goarch }}"
              echo "- Recommended: run from SSH / shell"
            else
              if [ "${{ matrix.goos }}" == "windows" ]; then
                echo "- Windows: Windows 10+"
              elif [ "${{ matrix.goos }}" == "darwin" ]; then
                echo "- macOS: macOS 10.13+"
              else
                echo "- Linux: Ubuntu 18.04+ / Debian 10+ / CentOS 7+"
                echo "- Architecture: ${{ matrix.goarch }}"
              fi
            fi
            echo "- No Python installation required for running the binaries"
          } > release/README.txt
        shell: bash

      - name: Create archive (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'windows'
        run: |
          cd release
          powershell Compress-Archive -Path * -DestinationPath ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} -Force
        shell: powershell

      - name: Create archive (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'darwin'
        run: |
          cd release
          zip -r ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} .
        shell: bash

      - name: Create archive (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'linux'
        run: |
          cd release
          tar -czf ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} .
        shell: bash

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}
          path: ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }}
          retention-days: 30

  # OpenWrt LuCI 图形界面应用 (luci-app-ech-workers) —— 用 x86/64 SDK 构建 _all.ipk
  luci:
    name: Build LuCI ipk (OpenWrt SDK)
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: "24.10.8"
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      # 缓存 OpenWrt SDK + feeds（发行版 SDK 的 feeds 固定 commit，缓存安全）
      - name: Restore SDK + feeds cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ech-wk-luci-sdk-${{ env.SDK_VERSION }}

      - name: Download OpenWrt SDK (24.10)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          set -e
          SDK_BASE="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/x86/64"
          # 从 sha256sums 动态解析 SDK 文件名（不同版本 gcc 版本/命名不同，不硬编码）
          SDK_FILE=$(curl -s "${SDK_BASE}/sha256sums" \
            | awk '/openwrt-sdk-.*-x86-64.*\.tar\.zst/{print $2; exit}' | sed 's/^\*//')
          if [ -z "$SDK_FILE" ]; then
            echo "找不到 SDK 文件，请升级 SDK_VERSION"
            exit 1
          fi
          echo "SDK: $SDK_FILE"
          curl -fSL -o sdk.tar.zst "${SDK_BASE}/${SDK_FILE}"
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
        shell: bash

      # 提供 feeds/luci/luci.mk 及 luci-base 等依赖（luci-app-ech-workers/Makefile include 它）
      - name: Update & install feeds
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        shell: bash

      - name: Configure buildroot
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: cd sdk && make defconfig
        shell: bash

      - name: Build luci-app-ech-workers
        run: |
          rm -rf sdk/package/luci-app-ech-workers
          cp -r luci-app-ech-workers sdk/package/luci-app-ech-workers
          cd sdk
          make package/luci-app-ech-workers/compile V=s
        shell: bash

      - name: Locate ipk
        run: find sdk/bin -name 'luci-app-ech-workers_*.ipk' -exec cp {} . \;
        shell: bash

      - name: Save SDK + feeds cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ech-wk-luci-sdk-${{ env.SDK_VERSION }}

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-ech-workers
          path: luci-app-ech-workers_*.ipk
          retention-days: 30

  # 防漂移：校验 softrouter 架构名在 矩阵 / uci-defaults / softrouter.sh 三处一致
  check-arch-alignment:
    name: Verify softrouter arch alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check arch names across matrix / uci-defaults / softrouter.sh
        run: |
          python3 - <<'PY'
          import re, yaml
          wf = yaml.safe_load(open('.github/workflows/build.yml'))
          m = wf['jobs']['build']['strategy']['matrix']['include']
          # 矩阵实际产出的软路由归档名（goos-goarch-suffix-ext 拼接）
          produced = set()
          for e in m:
              if e.get('target') == 'softrouter':
                  produced.add("ECHWorkers-{goos}-{goarch}{suffix}{ext}".format(
                      goos=e['goos'], goarch=e['goarch'],
                      suffix=e.get('artifact_suffix', ''), ext=e['archive_ext']))
          # uci-defaults 引用的产物名
          uci = open('luci-app-ech-workers/root/etc/uci-defaults/luci-ech-workers').read()
          refs = set(re.findall(r'ECHWorkers-linux-[a-z0-9-]+-softrouter\.tar\.gz', uci))
          missing = refs - produced
          assert not missing, "uci-defaults 引用但矩阵不产出: %s" % sorted(missing)
          unreferenced = produced - refs
          assert not unreferenced, "矩阵产出但 uci-defaults 未引用: %s" % sorted(unreferenced)
          # softrouter.sh get_arch() 的架构 token
          src = open('softrouter.sh').read()
          ga = src[src.index('get_arch()'):src.index('}', src.index('get_arch()'))]
          tokens = set(re.findall(r'echo "([a-z0-9]+)"', ga)) - {'$arch'}
          for t in tokens:
              assert any(("linux-%s-softrouter.tar.gz" % t) in n for n in produced), \
                  "softrouter.sh 架构 %s 无对应矩阵产物" % t
          # 反向：每个矩阵软路由产物的架构 token 必须被 uci-defaults 或 softrouter.sh 覆盖
          for n in produced:
              tok = re.search(r'linux-([a-z0-9]+)-softrouter\.tar\.gz', n).group(1)
              assert tok in tokens or (("linux-%s-softrouter.tar.gz" % tok) in uci), \
                  "架构 %s 缺少覆盖" % tok
          print("OK: 矩阵 / uci-defaults / softrouter.sh 三方对齐; softrouter 产物 %d 个" % len(produced))
          PY
        shell: bash

  release:
    needs: [build, luci]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
